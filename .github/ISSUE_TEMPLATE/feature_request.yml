name: Feature request
description: Something falcon-grid should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to build, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API or behaviour you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
  - type: markdown
    attributes:
      value: |
        Spreadsheet features (formulas, fill handle, merged cells), pivoting, charts in cells and WebGL are out of scope for 0.1; see the README's non-goals.
